<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TeeStore (Single File)</title>
<style>
  :root{--bg:#0f1115;--panel:#161a23;--text:#eef2f7;--muted:#9aa3af;--accent:#3b82f6;--border:rgba(255,255,255,.12);--card:#141826;--ok:#10b981}
  *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Inter,Arial}
  header{position:sticky;top:0;z-index:10;background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02));border-bottom:1px solid var(--border)}
  .container{width:min(1200px,94vw);margin:0 auto}.nav{display:flex;gap:12px;align-items:center;padding:12px 0}
  .logo{width:34px;height:34px;border-radius:10px;background:conic-gradient(from 180deg,var(--accent),#8b5cf6,#f472b6,var(--accent))}
  .search{flex:1;display:flex;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:8px 10px}
  .search input{flex:1;background:transparent;border:0;color:var(--text);outline:none}
  .cart-btn{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;padding:16px 0}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
  .card img{width:100%;aspect-ratio:3/4;object-fit:cover;background:#0a0d14}
  .pad{padding:10px 12px}.title{font-weight:700}.muted{color:var(--muted);font-size:13px}
  .price{display:flex;gap:8px;align-items:center}.badge{background:#10b98122;color:#10b981;border:1px solid #10b98155;font-size:12px;padding:2px 6px;border-radius:999px}
  .add{background:var(--accent);color:white;border:0;padding:10px;border-radius:10px;font-weight:700;cursor:pointer;margin-left:auto}
  .drawer{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:50}.drawer.open{display:block}
  .panel{position:absolute;right:0;top:0;bottom:0;width:min(380px,96vw);background:#0f131e;border-left:1px solid var(--border);display:flex;flex-direction:column}
  .panel header{display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:1px solid var(--border)}
  .items{flex:1;overflow:auto;padding:12px}.row{display:flex;justify-content:space-between}
  .qty{display:flex;gap:6px;align-items:center}.qty button{width:26px;height:26px;border-radius:8px;background:#0b1220;border:1px solid var(--border);color:var(--text);cursor:pointer}
  .remove{background:transparent;border:0;color:#fca5a5;cursor:pointer}
  .foot{border-top:1px solid var(--border);padding:12px;display:flex;flex-direction:column;gap:10px}
  .checkout{background:var(--ok);color:#04210f;border:0;border-radius:10px;padding:12px;font-weight:800;cursor:pointer}
</style>
</head>
<body>
  <header>
    <div class="container nav">
      <div class="logo" aria-hidden="true"></div>
      <strong>TeeStore</strong>
      <div class="search"><input id="q" placeholder="Search tees…"></div>
      <button id="open" class="cart-btn">🛒 <span id="count">0</span></button>
    </div>
  </header>

  <main class="container">
    <div id="grid" class="grid" aria-live="polite"></div>
  </main>

  <div id="drawer" class="drawer" aria-hidden="true">
    <div class="panel">
      <header><h3>Your Cart</h3><button id="close" class="remove">✕</button></header>
      <div id="items" class="items"></div>
      <div class="foot">
        <div class="row"><span>Subtotal</span><span>₹ <b id="subtotal">0</b></span></div>
        <button id="checkout" class="checkout">Checkout</button>
      </div>
    </div>
  </div>

<script>
const IMG = (label,bg="#111827",fg="#e5e7eb") =>
  'data:image/svg+xml;utf8,' + encodeURIComponent(
    `<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200">
      <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="${bg}"/><stop offset="100%" stop-color="#0b1020"/></linearGradient></defs>
      <rect width="100%" height="100%" fill="url(#g)"/>
      <text x="50%" y="50%" text-anchor="middle" fill="${fg}" font-size="48" font-family="Arial">`+label+`</text>
    </svg>`);

// Inline products so no fetch is needed
const PRODUCTS = [
  {id:"tee-001",title:"Classic Black Tee",price:699,mrp:999,popularity:98,rating:4.7,addedAt:"2025-05-20",sizes:["S","M","L","XL"],colors:["black"],image:IMG("Black","#0b0f19","#e5e7eb")},
  {id:"tee-002",title:"Classic White Tee",price:599,mrp:899,popularity:92,rating:4.6,addedAt:"2025-05-12",sizes:["S","M","L","XL","XXL"],colors:["white"],image:IMG("White","#f3f4f6","#111827")},
  {id:"tee-003",title:"Navy Blue Tee",price:649,mrp:999,popularity:90,rating:4.5,addedAt:"2025-04-30",sizes:["M","L","XL"],colors:["navy"],image:IMG("Navy","#0f274a","#e5e7eb")},
  {id:"tee-004",title:"Charcoal Grey Tee",price:629,mrp:949,popularity:88,rating:4.4,addedAt:"2025-04-18",sizes:["S","M","L"],colors:["grey"],image:IMG("Grey","#374151","#e5e7eb")}
];

const state = { q:"", cart:{}, cartKey:"teestore_sf_cart" };
const $ = s => document.querySelector(s);
const $$ = (s,root=document) => Array.from(root.querySelectorAll(s));
const money = n => new Intl.NumberFormat('en-IN').format(n);
const pct = (p,m)=> m>p ? Math.round(((m-p)/m)*100) : null;

function loadCart(){ try{ state.cart = JSON.parse(localStorage.getItem(state.cartKey)||"{}"); }catch{ state.cart = {}; } }
function saveCart(){ localStorage.setItem(state.cartKey, JSON.stringify(state.cart)); }
function cartCount(){ return Object.values(state.cart).reduce((s,i)=>s+i.qty,0); }
function cartSubtotal(){ return Object.values(state.cart).reduce((s,i)=> s + (PRODUCTS.find(p=>p.id===i.id)?.price||0)*i.qty, 0); }
function addToCart(id){ state.cart[id] = {id, qty:(state.cart[id]?.qty||0)+1}; saveCart(); badge(); }

function badge(){ $("#count").textContent = cartCount(); }

function render(){
  const grid = $("#grid"); grid.innerHTML = "";
  const list = PRODUCTS.filter(p => (p.title).toLowerCase().includes(state.q));
  list.forEach(p=>{
    const off = pct(p.price,p.mrp);
    const el = document.createElement("div");
    el.className="card";
    el.innerHTML = `
      <img src="${p.image}" alt="${p.title}">
      <div class="pad">
        <div class="title">${p.title}</div>
        <div class="price"><strong>₹${money(p.price)}</strong> <s class="muted">₹${money(p.mrp)}</s> ${off?`<span class="badge">${off}% off</span>`:""}</div>
        <div style="display:flex;align-items:center;gap:8px"><small class="muted">⭐ ${p.rating}</small><button class="add" data-id="${p.id}">Add</button></div>
      </div>`;
    grid.appendChild(el);
  });
  $$(".add",grid).forEach(b=> b.onclick = ()=>{ addToCart(b.dataset.id); });
}

function renderCart(){
  const box = $("#items"); box.innerHTML = "";
  for(const [key,it] of Object.entries(state.cart)){
    const p = PRODUCTS.find(x=>x.id===it.id); if(!p) continue;
    const row = document.createElement("div");
    row.style.borderBottom = "1px solid var(--border)";
    row.style.padding = "8px 0";
    row.innerHTML = `
      <div class="row"><strong>${p.title}</strong><button class="remove" data-key="${key}">Remove</button></div>
      <div class="qty"><button class="d" data-key="${key}">-</button><span>${it.qty}</span><button class="i" data-key="${key}">+</button><span style="margin-left:auto">₹${money(p.price*it.qty)}</span></div>`;
    box.appendChild(row);
  }
  $("#subtotal").textContent = money(cartSubtotal());
  $$(".remove",box).forEach(b=> b.onclick=()=>{ delete state.cart[b.dataset.key]; saveCart(); renderCart(); badge(); });
  $$(".i",box).forEach(b=> b.onclick=()=>{ state.cart[b.dataset.key].qty++; saveCart(); renderCart(); badge(); });
  $$(".d",box).forEach(b=> b.onclick=()=>{ state.cart[b.dataset.key].qty--; if(state.cart[b.dataset.key].qty<=0) delete state.cart[b.dataset.key]; saveCart(); renderCart(); badge(); });
}

async function checkout(){
  const items = Object.values(state.cart).map(x=>({id:x.id,qty:x.qty}));
  const subtotal = cartSubtotal();
  if(!items.length){ alert("Your cart is empty."); return; }
  try{
    const res = await fetch("http://localhost:4000/api/orders",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({items,subtotal})});
    if(!res.ok) throw new Error("No API");
    const data = await res.json();
    alert("Order placed. ID: "+data.orderId);
    state.cart = {}; saveCart(); renderCart(); badge();
  }catch{
    alert("Checkout demo: no backend detected. When you run the API at http://localhost:4000, orders will save to your database.");
  }
}

document.addEventListener("DOMContentLoaded", ()=>{
  loadCart(); badge(); render();
  $("#q").oninput = e => { state.q = e.target.value.trim().toLowerCase(); render(); };
  $("#open").onclick = ()=>{ $("#drawer").classList.add("open"); renderCart(); };
  $("#close").onclick = ()=>{ $("#drawer").classList.remove("open"); };
  $("#checkout").onclick = checkout;
});
</script>
</body>
</html>
